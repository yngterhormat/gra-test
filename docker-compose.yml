services:
  testapp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      DB_HOST: testpostgres
      RUN_MIGRATIONS: "true"
    volumes:
      - ./:/var/www/html
    depends_on:
      testpostgres:
        condition: service_healthy
    networks:
      - user-network

  testnginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - testapp
    networks:
      - user-network

  testpostgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-db}
      POSTGRES_USER: ${DB_USERNAME:-db}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-db}
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - user-network

networks:
  user-network:
    driver: bridge
